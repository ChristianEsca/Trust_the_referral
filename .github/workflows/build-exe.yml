name: Build EXE (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            make
            git

      - name: Get raylib
        run: git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git

      - name: Build raylib
        run: make -C raylib/src PLATFORM=PLATFORM_DESKTOP

      - name: Build game
        run: gcc src/raylib_game.c -o TrustTheReferral.exe -I raylib/src -L raylib/src -lraylib -lopengl32 -lgdi32 -lwinmm -static -mwindows

      - uses: actions/upload-artifact@v4
        with:
          name: TrustTheReferral-windows
          path: TrustTheReferral.exe
